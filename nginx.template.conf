# Gemini2API Nginx 配置
# upstream 后端连接池配置
upstream gemini2api {
    server gemini2api:8000 max_fails=3 fail_timeout=30s;
    keepalive 64;              # 保持 64 个空闲连接
    keepalive_requests 10000;  # 每个连接处理 1 万请求后关闭
    keepalive_timeout 60s;     # 空闲连接保持 60 秒
}

server {
    listen 80;
    server_name _;
    client_max_body_size 32m;

    # ----------------------
    # 从 Cloudflare 取真实 IP（如果前面是 CF）
    # ipv4_ref: https://www.cloudflare.com/ips-v4
    # ipv6_ref: https://www.cloudflare.com/ips-v6
    # ----------------------
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;

    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    # 通用安全响应头（所有 location 都生效）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 静态文件目录 - outputs
    location ^~ /outputs/ {
        alias /usr/share/nginx/html/outputs/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        gzip off;
        location ~ /\. {
            deny all;
        }
        access_log off;
    }

    # API 代理到后端
    location / {
        proxy_pass http://gemini2api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 传递网关注入的用户认证信息
        proxy_set_header X-User-Id $http_x_user_id;
        proxy_set_header X-User-Email $http_x_user_email;
        proxy_set_header X-User-Name $http_x_user_name;

        # 性能优化
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 8k;
        proxy_busy_buffers_size 16k;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
