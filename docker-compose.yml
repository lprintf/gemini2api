# Gemini2API Docker Compose 配置（无头模式）

services:
  gemini2api:
    build:
      context: .
      dockerfile: Dockerfile
    image: gemini2api:latest
    restart: unless-stopped
    # --- 核心配置开始 ---
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    privileged: true
    shm_size: 32gb
    volumes:
      - ./server:/app/server:ro
      - ${DATA_DIR:-./data}:/app/data
      - ./tests:/app/tests:ro
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - DEFAULT_ACCOUNT_PASSWORD=${DEFAULT_ACCOUNT_PASSWORD}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - default

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    # --- 核心配置开始 ---
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${FRONTEND_PORT}:80"
    volumes:
      # nginx 配置挂载到 default.conf.template（覆盖 nginx 默认配置）
      - ./nginx.template.conf:/etc/nginx/templates/default.conf.template:ro
      # 静态文件目录（outputs）
      - ${DATA_DIR:-./data}/outputs:/usr/share/nginx/html/outputs:ro
      - ${DATA_DIR:-./data}/uploads:/usr/share/nginx/html/uploads:ro
      # 静态文件目录（Admin UI）
      - ./server/static:/usr/share/nginx/html/static:ro
    depends_on:
      - gemini2api
    networks:
      default:
      gateway:
        aliases:
          - ${COMPOSE_PROJECT_NAME:-gemini2api}-frontend
          - gemini2api.com

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME:-gemini2api}_internal
  gateway:
    external: true
    name: ${GATEWAY_NETWORK_NAME:-gateway}
