# Gemini2API Docker Compose 配置
# 单容器：API 服务 + 按需有头模式

services:
  gemini2api:
    build:
      context: .
      dockerfile: Dockerfile
    image: gemini2api:latest
    container_name: gemini2api
    hostname: gemini2api
    restart: unless-stopped
    # Chromium 共享内存
    shm_size: 2gb
    # 如遇浏览器问题可取消注释
    # security_opt:
    #   - seccomp=unconfined
    ports:
      - "${API_PORT:-8000}:8000"
      - "${RDP_PORT:-3500}:3500"
    volumes:
      # 代码挂载（开发模式，修改后无需重新构建）
      - ./main.py:/app/main.py:ro
      - ./core:/app/core:ro
      - ./server:/app/server:ro
      # 数据目录（包含 browser_data, gemini.db, logs, outputs 等）
      - ./data:/app/data
      # 配置文件
      - ./config:/app/config:ro
      # TLS 证书（RDP 连接需要）
      - ./certs:/etc/weston:ro
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - XDG_RUNTIME_DIR=/tmp
      - WAYLAND_DISPLAY=wayland-0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
