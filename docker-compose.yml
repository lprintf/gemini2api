# Gemini2API Docker Compose 配置
# 单容器：API 服务 + 按需有头模式

services:
  gemini2api:
    build:
      context: .
      dockerfile: Dockerfile
    image: gemini2api:latest
    # container_name: gemini2api
    # hostname: gemini2api
    restart: aways
    # Chromium 共享内存
    shm_size: 8gb
    # 如遇浏览器问题可取消注释
    # security_opt:
    #   - seccomp=unconfined
    # ports:
      # - "${RDP_PORT}:3500"
      # - "${API_PORT}:8000"
      # cloudflared access rdp --hostname rdp.example.com --url rdp://localhost:3389
    volumes:
      # 代码挂载（开发模式，修改后无需重新构建）
      - ./main.py:/app/main.py:ro
      - ./core:/app/core:ro
      - ./server:/app/server:ro
      # 数据目录（包含 browser_data, gemini.db, logs, outputs 等）
      - ${DATA_DIR:-./data}:/app/data
      # 配置文件
      - ./config:/app/config:ro
      # Weston RDP 配置
      - ./weston.ini:/app/weston.ini:ro
      # TLS 证书（RDP 连接需要）
      - ./certs:/etc/weston:ro
      - ./tests:/app/tests:ro
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - XDG_RUNTIME_DIR=/tmp
      - WAYLAND_DISPLAY=wayland-0
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - default

  frontend:
    image: nginx:alpine
    restart: aways
    # ports:
    #   - "${FRONTEND_PORT:-8080}:80"
    volumes:
      # nginx 配置挂载到 default.conf.template（覆盖 nginx 默认配置）
      - ./nginx.template.conf:/etc/nginx/templates/default.conf.template:ro
      # 静态文件目录（outputs）
      - ./data/outputs:/usr/share/nginx/html/outputs:ro
      - ./data/uploads:/usr/share/nginx/html/uploads:ro
    depends_on:
      - gemini2api
    networks:
      default:
      gateway:
        aliases:
          - ${COMPOSE_PROJECT_NAME:-gemini2api}-frontend
          - gemini2api.com

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME:-gemini2api}_internal
  gateway:
    external: true
    name: ${GATEWAY_NETWORK_NAME:-gateway}
