[project]
name = "gemini2api"
version = "0.1.0"
description = "Gemini Image Edit API - OpenAI-compatible image editing API powered by Google Gemini"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.57.0",
    "aiosqlite>=0.22.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.40.0",
    "pydantic>=2.12.5",
    "pillow>=12.1.0",
    "python-multipart>=0.0.21",
]

[tool.uv]
package = false
